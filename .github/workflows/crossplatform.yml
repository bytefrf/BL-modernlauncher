name: crossplatform-checks

# Проверка кроссплатформенной части лаунчера на НАСТОЯЩИХ macOS и Linux.
# Кросс-компиляция с Windows ловит только ошибки компиляции; всё, что зависит от ОС
# (пути вида ~/Library, поиск Java, распаковка tar.gz, POSIX-скрипты), проверяется здесь.
#
# Windows-релиз собирает отдельный workflow build.yml — он не тронут.

on:
  push:
    branches: [ main, 'fix/**', 'ci/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_check:
        description: "Полный прогон: установить сборку (~2,8 ГБ) и запустить игру"
        type: boolean
        default: false

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon: та же архитектура, что и в osx-arm64 пакете
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Решение целиком здесь не собрать: Launcher.App и Launcher.Bootstrapper — WPF/net8.0-windows.
      # Собираем ровно то, что обязано работать на этих системах.
      - name: Build core
        run: dotnet build Launcher.Core/Launcher.Core.csproj -c Release --nologo

      - name: Build offline tests
        run: dotnet build SmokeTest/SmokeTest.csproj -c Release --nologo

      - name: Build UI
        run: dotnet build Launcher.Avalonia/Launcher.Avalonia.csproj -c Release --nologo

      # Каждый режим — отдельный набор проверок. Прогоняем ВСЕ, даже если один упал:
      # интересна полная картина расхождений с Windows, а не первая же ошибка.
      - name: Offline checks
        shell: bash
        run: |
          set -u
          smoke="SmokeTest/bin/Release/net8.0/SmokeTest"
          failed=0
          for mode in --selftest --classify --embedded --manifest-fallback --catalog \
                      --primary-action --profile-isolation --markdown --servers --error-report \
                      --crash --update-plan --appimage-update --macbundle-update; do
            echo "::group::$mode"
            if ! "$smoke" "$mode"; then
              echo "::error::режим $mode завершился с ошибкой"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Publish self-contained package
        run: >
          dotnet publish Launcher.Avalonia/Launcher.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:DebugType=none -o publish/${{ matrix.rid }}

      # Права на исполняемый файл теряются при упаковке в zip средствами actions/upload-artifact,
      # поэтому проверяем их здесь, пока файл лежит на диске раннера.
      - name: Check entry point
        shell: bash
        run: |
          exe="publish/${{ matrix.rid }}/Launcher.Avalonia"
          test -f "$exe" || { echo "::error::нет точки входа $exe"; exit 1; }
          chmod +x "$exe"
          file "$exe"
          # Без пайпа в head: раннер запускает bash с pipefail, и закрытый head роняет шаг
          # с «Broken pipe» на ровном месте.
          echo "файлов в пакете: $(ls -1 "publish/${{ matrix.rid }}" | wc -l)"
          du -sh "publish/${{ matrix.rid }}"

      # Снимки каждого окна. Ловят то, что сборка не ловит: свои Min-размеры контролов Fluent,
      # отсутствие шрифта, потерянные ресурсы — всё это вылезает только в рантайме.
      # Приложение снимает окна само (RenderTargetBitmap), скриншотилка ОС не нужна.
      - name: Screenshots
        shell: bash
        run: |
          set -e
          exe="publish/${{ matrix.rid }}/Launcher.Avalonia"
          out="$PWD/screenshots/${{ matrix.rid }}"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # На раннере нет дисплея, а Avalonia без него не поднимет окно.
            if ! command -v xvfb-run >/dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            fi
            xvfb-run -a "$exe" "--screenshot=$out" --profile=ci
          else
            "$exe" "--screenshot=$out" --profile=ci
          fi
          ls -1 "$out"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.rid }}
          path: screenshots/${{ matrix.rid }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      # Готовые к раздаче пакеты: .deb и .AppImage для Linux, .app в .dmg для macOS.
      # Собираются на своей же системе — dpkg-deb и hdiutil кросс-платформенных аналогов
      # не имеют.
      - name: Build installable packages
        shell: bash
        run: |
          set -e
          # sed, а не grep -P: на macOS grep из BSD и ключа -P у него нет.
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Launcher.Avalonia/Launcher.Avalonia.csproj | head -1)
          echo "версия: $version"
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash packaging/build-linux-packages.sh "publish/${{ matrix.rid }}" "$version" packages
          else
            bash packaging/build-macos-package.sh "publish/${{ matrix.rid }}" "$version" packages
          fi
          ls -la packages

      # Настоящая проверка macOS-пакета: монтируем .dmg, ставим приложение в /Applications
      # и запускаем — ровно как игрок. Раннер и есть живой мак, другого стенда нет.
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          dmg=$(ls packages/*.dmg)
          echo "образ: $dmg"

          hdiutil attach "$dmg" -mountpoint /Volumes/BLTest -nobrowse -quiet
          ls -la /Volumes/BLTest
          test -d "/Volumes/BLTest/BL-modern.app" || { echo "::error::в образе нет бандла"; exit 1; }
          test -f "/Volumes/BLTest/ЧИТАТЬ.txt" || echo "::warning::в образе нет инструкции"

          cp -R "/Volumes/BLTest/BL-modern.app" /Applications/
          hdiutil detach /Volumes/BLTest -quiet

          app="/Applications/BL-modern.app"
          echo "--- подпись ---"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -3
          echo "--- что скажет Gatekeeper ---"
          # Без нотаризации оценка отрицательная — это ожидаемо, поэтому не валим шаг.
          spctl --assess --type execute --verbose=2 "$app" 2>&1 | tail -3 || true

          echo "--- запуск из бандла: ставит Java и проверяет её ---"
          cp packaging/ci-launcher.config.json "$app/Contents/MacOS/launcher.config.json"
          "$app/Contents/MacOS/Launcher.Avalonia" --check-runtime --profile=ci 2>&1 | tail -12

          echo "--- окна из установленного бандла ---"
          "$app/Contents/MacOS/Launcher.Avalonia" "--screenshot=$PWD/screenshots/${{ matrix.rid }}-installed" --profile=ci 2>&1 | tail -3

      # Полный прогон по требованию: установка сборки целиком и запуск игры.
      # На каждый пуш не гоняем — это ~10 минут и несколько гигабайт трафика.
      - name: Full install and launch
        if: inputs.full_check
        shell: bash
        run: |
          set -e
          exe="publish/${{ matrix.rid }}/Launcher.Avalonia"
          cp packaging/ci-launcher.config.json "$(dirname "$exe")/launcher.config.json"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$exe" --check-launch --watch-seconds=90 --profile=fullci
          else
            "$exe" --check-launch --watch-seconds=90 --profile=fullci
          fi

      - name: Upload installable packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.rid }}
          path: packages
